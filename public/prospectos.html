<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: panel de filtros y lista a la izquierda, plano de coordenadas a la derecha; en celular el plano arriba y la lista abajo. */
:root{
  --bg:#F3F5F4; --panel:#FFFFFF; --fg:#17211F; --muted:#5E6B68; --line:#D8DFDD; --map:#E9EEEC; --grid:#CDD6D3;
  --alta:#D93A2B; --media:#E39B1B; --baja:#8A94A3; --accent:#0F6F66; --on:#FFFFFF; --sel:#E2F1EE;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --panel:#172120; --fg:#E6EEEC; --muted:#93A39F; --line:#2A3836; --map:#121B1A; --grid:#25322F;
  --alta:#F0604F; --media:#F0B040; --baja:#8D98A8; --accent:#4FC1B4; --on:#10201E; --sel:#1E3532; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --panel:#172120; --fg:#E6EEEC; --muted:#93A39F; --line:#2A3836; --map:#121B1A; --grid:#25322F;
  --alta:#F0604F; --media:#F0B040; --baja:#8D98A8; --accent:#4FC1B4; --on:#10201E; --sel:#1E3532; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px;margin:0}
.app{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:12px;min-height:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;min-width:0}
.head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:17px;font-weight:600;margin:0 0 2px;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px;margin:0}
.filters{padding:10px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px var(--sans);border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:4px 9px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.chip[aria-pressed="false"]{opacity:.45}
.chip:focus-visible,.item:focus-visible,.btn:focus-visible,input:focus-visible,.mk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
input[type=search]{width:100%;font:13px var(--sans);padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.count{font:12px var(--mono);color:var(--muted);padding:8px 14px 4px}
.list{overflow:auto;flex:1;min-height:0;padding:0 6px 8px}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:6px;padding:7px 8px;color:var(--fg);font:inherit;cursor:pointer}
.item:hover,.item.on{background:var(--sel)}
.item b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font:500 12px var(--mono)}
.ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--on)}
.mapwrap{position:relative;min-height:0;min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--map)}
#map{position:absolute;inset:0;z-index:0}
.leaflet-container{font:inherit}
.mk{position:static;transform:none}
.pin{display:grid;place-items:center;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.45);line-height:1;color:#fff}
.pin.sel{outline:3px solid #111;outline-offset:2px}
svg#grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mk{position:absolute;border:2px solid var(--panel);border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.35);font-family:inherit;line-height:1}
.mk.sel{outline:3px solid var(--fg);outline-offset:2px}
.zl{position:absolute;font:11px var(--mono);color:var(--muted);pointer-events:none;text-transform:uppercase;letter-spacing:.08em;transform:translate(-50%,-50%)}
.ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.btn{width:32px;height:32px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;font:500 16px var(--sans);cursor:pointer}
.legend{z-index:1000;position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.card{z-index:1000;position:absolute;left:10px;top:10px;width:min(320px,calc(100% - 64px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.card h2{font-size:15px;margin:0 22px 2px 0;font-weight:600}
.card .meta{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.card dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13px}
.card dt{color:var(--muted)} .card dd{margin:0;overflow-wrap:anywhere}
.badge{display:inline-block;font:500 11px var(--mono);padding:1px 7px;border-radius:999px;color:var(--on);margin-right:6px}
.card a{color:var(--accent);font-weight:500}
.x{position:absolute;right:6px;top:6px;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;width:28px;height:28px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.none{padding:8px 14px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.none summary{cursor:pointer}
.none ul{margin:6px 0 0;padding-left:16px}
@media (max-width:800px){
  body{padding-block:8px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(240px,42vh) minmax(220px,1fr);min-height:100%}
  .mapwrap{order:-1}
  .card{top:auto;bottom:10px;left:10px;width:calc(100% - 20px)}
  .legend{display:none}
  .list{min-height:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body><div class="app">
  <section class="panel" aria-label="Lista de negocios">
    <div class="head">
      <h1>Mapa de prospectos en Coronel</h1>
      <p class="sub">Color: prioridad por puntaje. Ícono: rubro. Fuente: planilla v4.</p>

      <div class="row" id="fp"></div>
      <div class="row" id="fr"></div>
    </div>
    <div class="count" id="cnt"></div>
    <div class="list" id="list"></div>
    <details class="none" id="none"><summary></summary><ul id="nonel"></ul></details>
  </section>
  <section class="mapwrap" aria-label="Mapa">
    <div id="map"></div>
    <div class="ctl" style="z-index:1000;right:10px;top:auto;bottom:24px"><button class="btn" id="zr" aria-label="Ver todo" title="Ver todo">⌖</button></div>
    <div class="legend" id="leg"></div>
    <div class="card" id="card" hidden></div>
  </section>
</div>

const ICON={"Dental":"🦷","Médico":"🩺","Kinesiología":"🦴","Psicología":"🧠","Nutrición":"🍎","Veterinaria":"🐾","Peluquería / Barbería":"✂️","Estética / Uñas":"💅","Deporte / Recreación":"🏋️","Público (bajo encaje)":"🏥"};
const PCOL={Alta:"var(--alta)",Media:"var(--media)",Baja:"var(--baja)"};
const HEX={Alta:"#D93A2B",Media:"#E39B1B",Baja:"#6F7B8C"};
const st={p:{Alta:true,Media:true,Baja:true},r:{},q:"",sel:null};
const pts=DATA.pts, rubs=[...new Set(pts.map(x=>x.rub))];rubs.forEach(r=>st.r[r]=true);
const order={Baja:0,Media:1,Alta:2};
const map=L.map('map',{zoomControl:true}).setView([-37.015,-73.15],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);
function visible(x){return st.p[x.p]&&st.r[x.rub]&&(!st.q||(x.n+" "+x.dir).toLowerCase().includes(st.q))}
function size(x){return x.p==="Alta"?36:x.p==="Media"?30:24}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(){
  layer.clearLayers();
  const grp={};pts.filter(visible).forEach(x=>{(grp[x.lat+','+x.lng]=grp[x.lat+','+x.lng]||[]).push(x)});
  const off=new Map();Object.values(grp).forEach(a=>{if(a.length>1)a.forEach((x,i)=>{const t=2*Math.PI*i/a.length;off.set(x,[Math.sin(t)*0.00018,Math.cos(t)*0.00018])})});
  pts.filter(visible).sort((a,b)=>order[a.p]-order[b.p]).forEach(x=>{
    const s=size(x),o=off.get(x)||[0,0];
    const ic=L.divIcon({className:'',iconSize:[s,s],iconAnchor:[s/2,s/2],html:`<div class="pin${st.sel===x?' sel':''}" style="width:${s}px;height:${s}px;background:${HEX[x.p]};font-size:${Math.round(s*.52)}px">${ICON[x.rub]||'•'}</div>`});
    const m=L.marker([x.lat+o[0],x.lng+o[1]],{icon:ic,title:`${x.n} (${x.p})`,zIndexOffset:order[x.p]*100+(st.sel===x?1000:0)});
    m.on('click',()=>select(x,false));m.addTo(layer);
  });
}
function renderLists(){
  document.getElementById('fp').innerHTML=["Alta","Media","Baja"].map(p=>`<button class="chip" data-p="${p}" aria-pressed="${st.p[p]}"><span class="dot" style="background:${PCOL[p]}"></span>${p} · ${pts.filter(x=>x.p===p).length}</button>`).join('');
  document.getElementById('fr').innerHTML=rubs.map(r=>`<button class="chip" data-r="${r}" aria-pressed="${st.r[r]}">${ICON[r]||""} ${r} · ${pts.filter(x=>x.rub===r).length}</button>`).join('');
  const v=pts.filter(visible).sort((a,b)=>order[b.p]-order[a.p]||b.s-a.s||a.n.localeCompare(b.n));
  document.getElementById('cnt').textContent=`${v.length} de ${pts.length} en el mapa`;
  const Lh=document.getElementById('list');Lh.innerHTML='';
  v.forEach(x=>{const b=document.createElement('button');b.className='item'+(st.sel===x?' on':'');
    b.innerHTML=`<span class="ic" style="background:${PCOL[x.p]}">${ICON[x.rub]||"•"}</span><span style="min-width:0"><b></b><small></small></span><span class="pts">${x.s} pts</span>`;
    b.querySelector('b').textContent=x.n;b.querySelector('small').textContent=x.p+' · '+x.dir;
    b.addEventListener('click',()=>select(x,true));Lh.appendChild(b)});
}
function select(x,center){
  st.sel=x;const c=document.getElementById('card');
  const gm=`https://www.google.com/maps/search/?api=1&query=${x.lat},${x.lng}`;
  c.hidden=false;
  c.innerHTML=`<button class="x" aria-label="Cerrar">×</button><h2>${esc(x.n)}</h2><p class="meta"><span class="badge" style="background:${PCOL[x.p]}">${x.p}</span>${esc(x.rub)} · ${x.s} puntos</p>
  <dl><dt>Dirección</dt><dd>${esc(x.dir)}</dd><dt>Teléfono</dt><dd>${esc(x.tel||'sin dato')}</dd><dt>Sitio web</dt><dd>${esc(x.web)}</dd><dt>WhatsApp</dt><dd>${esc(x.wa)}</dd></dl>
  <p class="note">${x.ap?'Ubicación aproximada: la dirección es incompleta o ambigua. ':''}<a href="${gm}" target="_blank" rel="noopener">Abrir en Google Maps</a></p>`;
  c.querySelector('.x').onclick=()=>{st.sel=null;c.hidden=true;draw();renderLists()};
  if(center)map.setView([x.lat,x.lng],Math.max(map.getZoom(),16));
  draw();renderLists();
}
function fit(){const v=pts.filter(visible);if(v.length)map.fitBounds(L.latLngBounds(v.map(x=>[x.lat,x.lng])),{padding:[40,40]})}
document.getElementById('fp').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;st.p[b.dataset.p]=!st.p[b.dataset.p];renderLists();draw()});
document.getElementById('fr').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;st.r[b.dataset.r]=!st.r[b.dataset.r];renderLists();draw()});
document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value.trim().toLowerCase();renderLists();draw()});
document.getElementById('zr').onclick=fit;
document.getElementById('leg').innerHTML=["Alta","Media","Baja"].map(p=>`<span><i class="dot" style="background:${PCOL[p]}"></i>${p}</span>`).join('')+rubs.map(r=>`<span>${ICON[r]||''} ${r}</span>`).join('');
const nn=DATA.none;document.querySelector('#none summary').textContent=`${nn.length} negocios sin ubicación (dirección incompleta)`;
document.getElementById('nonel').innerHTML=nn.map(x=>`<li>${esc(x.n)} · ${x.p}</li>`).join('');
renderLists();draw();map.invalidateSize();fit();
new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map'));
</script>
