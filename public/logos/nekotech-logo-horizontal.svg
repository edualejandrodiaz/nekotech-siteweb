<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
<title>Logo horizontal de nekotech</title>
<desc>Un gato geométrico de bordes cuadrados con lentes y bigotes a la izquierda, con el nombre nekotech al lado derecho en letra grande, a la misma altura</desc>

<g transform="translate(-125,-20)">
<rect x="230" y="60" width="60" height="60" fill="#1f2937"/>
<rect x="390" y="60" width="60" height="60" fill="#1f2937"/>
<rect x="220" y="100" width="240" height="200" rx="16" fill="#1f2937"/>
<rect x="255" y="170" width="60" height="60" rx="6" fill="#0f172a" stroke="#e5e5e5" stroke-width="6"/>
<rect x="365" y="170" width="60" height="60" rx="6" fill="#0f172a" stroke="#e5e5e5" stroke-width="6"/>
<line x1="315" y1="200" x2="365" y2="200" stroke="#e5e5e5" stroke-width="6"/>
<rect x="326" y="250" width="28" height="20" fill="#e5e5e5"/>
<line x1="228" y1="240" x2="150" y2="222" stroke="#1f2937" stroke-width="5" stroke-linecap="square"/>
