<line x1="228" y1="270" x2="150" y2="288" stroke="#1f2937" stroke-width="5" stroke-linecap="square"/>
<line x1="452" y1="240" x2="530" y2="222" stroke="#1f2937" stroke-width="5" stroke-linecap="square"/>
<line x1="452" y1="255" x2="535" y2="255" stroke="#1f2937" stroke-width="5" stroke-linecap="square"/>
<line x1="452" y1="270" x2="530" y2="288" stroke="#1f2937" stroke-width="5" stroke-linecap="square"/>
</g>

<text x="460" y="210" font-family="Courier New, monospace" font-weight="700" font-size="135" text-anchor="start" fill="#1f2937">neko<tspan fill="#0f172a">tech</tspan></text>
</svg>
